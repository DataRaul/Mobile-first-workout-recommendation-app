name: Summarize enrichment regeneration

on:
  push:
    branches: [fix/enrichment-reproducibility]

permissions:
  contents: read

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Summarize changed fields
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const report = JSON.parse(fs.readFileSync("data/enrichment-regeneration-report.json", "utf8"));
          const idsByField = {};
          const goalTagOnly = [];
          for (const [id, fields] of Object.entries(report.changes)) {
            const names = Object.keys(fields);
            if (names.length === 1 && names[0] === "goalTags") goalTagOnly.push(id);
            for (const field of names) (idsByField[field] ||= []).push(id);
          }
          const fieldCounts = Object.fromEntries(Object.entries(idsByField).map(([field, ids]) => [field, ids.length]));
          console.log(JSON.stringify({
            changedCount: report.changedCount,
            fieldCounts,
            idsByField,
            goalTagOnlyCount: goalTagOnly.length,
            goalTagOnly,
          }, null, 2));
          NODE
