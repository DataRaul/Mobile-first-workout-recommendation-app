name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Complete exact session-slot source fix on audit branch
        if: github.event_name == 'pull_request' && github.head_ref == 'test/full-browser-user-flows'
        env:
          PR_HEAD: ${{ github.head_ref }}
        run: |
          git fetch origin "$PR_HEAD"
          git switch -C pr-head "origin/$PR_HEAD"
          python - <<'PY'
          from pathlib import Path

          path = Path('src/app.js')
          text = path.read_text()
          old = '''  if (scope === "session") {
    const session = state.activeSession;
    if (!session) return null;
    const item = session.exercises[session.currentIndex];
    const workout = state.activeProgram?.workouts.find((entry) => entry.id === session.workoutId);
'''
          new = '''  if (scope === "session") {
    const session = state.activeSession;
    if (!session) return null;
    const sessionItemIndex = session.currentIndex;
    const item = session.exercises[sessionItemIndex];
    const workout = state.activeProgram?.workouts.find((entry) => entry.id === session.workoutId);
'''
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text)
          elif 'const sessionItemIndex = session.currentIndex;' not in text:
              raise SystemExit('Expected session replacement context block not found')
          PY
          if git diff --quiet -- src/app.js; then
            echo "Exact-slot definition already present."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- src/app.js
            git diff --cached --check
            git commit -m "Define permanent session substitution slot"
            git push origin HEAD:"$PR_HEAD"
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate repository and self-contained regressions
        run: npm run validate
      - name: Verify enrichment reproducibility
        run: npm run enrichment:check
      - name: Run programme regression explicitly
        run: node scripts/test-programme.mjs
      - name: Run real 1,324-exercise recommendation matrix
        run: |
          curl -fsSL https://raw.githubusercontent.com/hasaneyldrm/exercises-dataset/main/data/exercises.json -o /tmp/exercises.json
          printf '%s  %s\n' '656634224b8977b99a6d765470ee123260d4979715eaa4e7c0b7c8bb0d79f93d' '/tmp/exercises.json' | sha256sum -c -
          npm run test:matrix -- --source /tmp/exercises.json
      - name: Install pinned browser smoke-test dependency
        run: npm install --no-audit --no-fund
      - name: Install Chromium for interaction smoke
        run: npx playwright install --with-deps chromium
      - name: Run real-browser interaction smoke
        run: npm run test:browser
