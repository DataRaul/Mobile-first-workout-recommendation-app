name: One-off Agent OS browser shadow

on:
  pull_request:
    paths:
      - .github/workflows/agent-os-browser-shadow-oneoff.yml

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install exact browser observation CLI in temporary directory
        run: npm install --prefix "$RUNNER_TEMP/agent-os-cli" --no-audit --no-fund @playwright/cli@0.1.21
      - name: Observe local application without interaction
        shell: bash
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/agent-os-browser-config.json"
          session="$RUNNER_TEMP/agent-os-browser-session"
          cli="$RUNNER_TEMP/agent-os-cli/node_modules/.bin/playwright-cli"
          mkdir -p "$session"
          cat > "$config" <<'JSON'
          {
            "browser": {"browserName": "chromium", "isolated": true, "launchOptions": {"channel": "chrome"}},
            "outputMode": "stdout",
            "network": {"allowedOrigins": ["http://127.0.0.1:8765"]},
            "codegen": "none"
          }
          JSON
          python -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/agent-os-server.log" 2>&1 &
          server_pid=$!
          trap '"$cli" close >/dev/null 2>&1 || true; kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 0.1
          done
          curl --fail --silent http://127.0.0.1:8765/ >/dev/null
          cd "$session"
          "$cli" open http://127.0.0.1:8765/ --config="$config" >/dev/null
          "$cli" snapshot > "$RUNNER_TEMP/agent-os-snapshot.txt"
          "$cli" find "Workout" > "$RUNNER_TEMP/agent-os-find.txt"
          "$cli" console > "$RUNNER_TEMP/agent-os-console.txt"
          "$cli" requests > "$RUNNER_TEMP/agent-os-requests.txt"
          grep -F "Workout" "$RUNNER_TEMP/agent-os-snapshot.txt" >/dev/null
          grep -F "Workout" "$RUNNER_TEMP/agent-os-find.txt" >/dev/null
          grep -F "127.0.0.1:8765" "$RUNNER_TEMP/agent-os-requests.txt" >/dev/null
          cd "$GITHUB_WORKSPACE"
          test -z "$(git status --porcelain)"
          echo "AGENT_OS_BROWSER_SHADOW_OBSERVATION_PASS"
