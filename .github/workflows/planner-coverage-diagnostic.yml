name: Planner coverage diagnostic

on:
  push:
    branches:
      - "analysis/planner-coverage-consistency"

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download verified real exercise source
        run: |
          curl -fsSL https://raw.githubusercontent.com/hasaneyldrm/exercises-dataset/main/data/exercises.json -o /tmp/exercises.json
          printf '%s  %s\n' '656634224b8977b99a6d765470ee123260d4979715eaa4e7c0b7c8bb0d79f93d' '/tmp/exercises.json' | sha256sum -c -
      - name: Baseline matrix and classification
        run: |
          npm run test:matrix -- --source /tmp/exercises.json
          node scripts/diagnose-planner-coverage.mjs --source /tmp/exercises.json --label baseline
      - name: Apply candidate policy locally
        run: python scripts/apply-planner-candidate.py
      - name: Candidate matrix and classification
        run: |
          npm run test:matrix -- --source /tmp/exercises.json
          node scripts/diagnose-planner-coverage.mjs --source /tmp/exercises.json --label candidate
      - name: Run self-contained programme regression
        run: node scripts/test-programme.mjs
